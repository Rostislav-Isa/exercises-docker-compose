services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
  redis:
    image: redis:8.10.2-alpine
    ports:
      - 6379:6379
  backend:
    image: dockerunofficial/backend
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - 8080:8080
  frontend:
    image: dockerunofficial/frontend
    ports:
      - 5001:5001
