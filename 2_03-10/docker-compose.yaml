services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./database:/var/lib/postgresql
  redis:
    image: redis:8.10.2-alpine
    ports:
      - 6379:6379
  backend:
    image: dockerunofficial/backend
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    ports:
      - 8080:8080
  frontend:
    image: dockerunofficial/frontend
    ports:
      - 5001:5001
  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
